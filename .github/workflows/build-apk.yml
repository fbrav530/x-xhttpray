name: Build APK (unsigned)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # ---------- 1. gomobile：xtunnel.go -> libs/tunnel.aar ----------
      - name: Init Go module
        run: |
          set -euo pipefail
          if [ ! -f go.mod ]; then
            go mod init com.x.tunnel
          fi
          # 源码实际 import 的第三方包（见 *.go）
          go get github.com/google/uuid@latest
          go get github.com/xtaci/smux@latest
          # 先 tidy 业务依赖，再记录 gomobile 的 tool directive。
          # 顺序很关键：若先加 tool 再 tidy，tidy 会把它当成未使用而移除。
          go mod tidy

          # 新版 gomobile 要求 golang.org/x/mobile 出现在模块依赖图中，
          # 仅 go install 不够。tool directive 会写入 go.mod 并保持。
          go get -tool golang.org/x/mobile/cmd/gomobile
          go get -tool golang.org/x/mobile/cmd/gobind

          echo "=== go.mod ==="
          cat go.mod

      - name: Install gomobile
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" version || true

      - name: Build tunnel.aar
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p libs

          gomobile init

          # -javapkg com.x.tunnel  =>  com.x.tunnel.tunnel.Tunnel
          #   必须加，TProxyService.java 里就是这个 import
          # -androidapi 29          =>  与 src/main/jni/Application.mk 的 APP_PLATFORM 对齐
          # -target arm,arm64       =>  与 APP_ABI 对齐
          gomobile bind \
            -target=android/arm,android/arm64 \
            -androidapi 29 \
            -javapkg com.x.tunnel \
            -o libs/tunnel.aar \
            .

          echo "=== AAR ==="
          ls -lh libs/tunnel.aar
          unzip -l libs/tunnel.aar | head -20

      # ---------- 2. Android SDK / NDK ----------
      # ubuntu-latest 已预装 Android SDK（cmdline-tools / platforms / build-tools）。
      # 不用 android-actions/setup-android@v3：它在 bootstrap 阶段会尝试安装
      # 名为 "tools" 的旧包，新版 cmdline-tools 已移除该包，导致该 action 自身失败。
      - name: Install NDK and platforms
        run: |
          set -euo pipefail

          # 定位 SDK：优先环境变量，否则在 runner 常见路径中查找
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-}" ]; then
            for d in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk; do
              if [ -d "$d" ]; then ANDROID_HOME="$d"; export ANDROID_HOME; break; fi
            done
          fi
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found"; exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          # 找到 sdkmanager
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            ls -R "$ANDROID_HOME/cmdline-tools" 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # 先装 SDK 组件；NDK 版本如不存在，回退到 runner 已有版本
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" || true
          "$SDKMANAGER" "ndk;26.1.10909125" || echo "指定 NDK 不可用，改用已安装版本"

          NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "${NDK_DIR:-}" ] || [ ! -d "$NDK_DIR" ]; then
            echo "没有可用的 NDK"; ls "$ANDROID_HOME" || true; exit 1
          fi
          echo "NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

          # Gradle 用的路径文件
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "ndk.dir=$NDK_DIR"
          } > local.properties
          cat local.properties

      # ---------- 3. Gradle 打包（未签名） ----------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build unsigned APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=$ANDROID_NDK_HOME"
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Show outputs
        if: always()
        run: |
          echo "=== APK ==="
          find . -name "*.apk" -type f -print -exec ls -lh {} \;
          echo "=== native libs in APK ==="
          APK=$(find . -name "*-release-unsigned.apk" | head -1)
          if [ -n "$APK" ]; then unzip -l "$APK" | grep -E "\.so$" || true; fi

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: x-tunnel-unsigned-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 30
